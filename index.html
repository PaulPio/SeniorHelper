<!DOCTYPE html>
<html lang="en">go
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Interface - Frontend</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': '#4f46e5', 
                        'secondary': '#f3f4f6', 
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-lg bg-white shadow-xl rounded-xl flex flex-col h-[80vh] overflow-hidden">
        
        <header class="p-4 border-b border-gray-200 bg-primary rounded-t-xl">
            <h1 class="text-xl font-semibold text-white">
                <span class="font-bold">Chat</span>Bot Assistant
            </h1>
        </header>

        <main id="chat-window" class="flex-grow p-4 space-y-4 overflow-y-auto bg-gray-50">
            
            <div class="flex justify-start">
                <div class="bg-indigo-200 text-gray-800 p-3 rounded-lg max-w-xs shadow-md">
                    <p>Hello! I am ready to assist you. Please ask me anything.</p>
                </div>
            </div>

        </main>

        <footer class="p-4 border-t border-gray-200 bg-white">
            <div class="flex space-x-2">
                
                <input 
                    type="text" 
                    id="user-input" 
                    placeholder="Type your message here..."
                    class="flex-grow p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition duration-150 ease-in-out"
                    aria-label="Message input field"
                >
                
                <button 
                    id="send-button" 
                    class="bg-primary text-white font-semibold py-3 px-6 rounded-lg hover:bg-indigo-600 transition duration-150 ease-in-out shadow-md"
                    aria-label="Send message"
                >
                    Send
                </button>
            </div>
        </footer>
    </div>

    <script>
        const BACKEND_URL = 'https://seniorhelper.onrender.com'; 
1
        const chatWindow = document.getElementById('chat-window');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');

        function appendMessage(content, isUser) {
            const messageWrapper = document.createElement('div');
            const messageBubble = document.createElement('div');

            if (isUser) {
                messageWrapper.className = 'flex justify-end';
                messageBubble.className = 'bg-primary text-white p-3 rounded-lg max-w-xs shadow-md';
            } else {
                messageWrapper.className = 'flex justify-start';
                messageBubble.id = content === 'Thinking...' ? 'thinking-indicator' : ''; 
                const isError = content.startsWith('Error:');
                messageBubble.className = isError 
                    ? 'bg-red-400 text-white p-3 rounded-lg max-w-xs shadow-md'
                    : 'bg-indigo-200 text-gray-800 p-3 rounded-lg max-w-xs shadow-md';
            }

            messageBubble.innerHTML = `<p>${content}</p>`;
            messageWrapper.appendChild(messageBubble);
            chatWindow.appendChild(messageWrapper);
            
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }
        
        function removeThinkingIndicator() {
            const thinkingIndicator = document.getElementById('thinking-indicator');
            if (thinkingIndicator) {
                thinkingIndicator.parentElement.remove();
            }
        }

        async function handleSendMessage() {
            const messageText = userInput.value.trim();
            
            if (messageText === "") {
                return; 
            }

            appendMessage(messageText, true);
            userInput.value = '';
            sendButton.disabled = true;
            userInput.disabled = true;
            appendMessage('Thinking...', false); 

            try {
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message: messageText })
                });

                if (!response.ok) {
                    throw new Error(`HTTP Error: ${response.status} ${response.statusText}`);
                }

                const data = await response.json();
                
                const botResponse = data.response || "I received your message, but the response format was unexpected.";
                appendMessage(botResponse, false);

            } catch (error) {
                console.error('API Error:', error);
                appendMessage(`Error: Could not connect to the assistant. Please check the backend service.`, false);
                
            } finally {
                removeThinkingIndicator();
                sendButton.disabled = false;
                userInput.disabled = false;
                userInput.focus();
            }
        }

        sendButton.addEventListener('click', handleSendMessage);
        userInput.addEventListener('keypress', (event) => {
            if (event.key === 'Enter') {
                handleSendMessage();
            }
        });
    </script>
</body>
</html>
